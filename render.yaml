services:
  - type: web
    name: knight-x-raigen-vault
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: STORAGE_CHAT_ID
        sync: false
      - key: OWNER_ID
        value: "5684263622"
      - key: BOT_USERNAME
        value: "KNIGHTXRAIGENvaultBOT"
      - key: WEBHOOK_SECRET
        generateValue: true
